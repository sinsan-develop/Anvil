<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-surface-ids="execution-mode,role-routing,egress-profile"><rect width="1920" height="1080" fill="#0B1220"/><rect x="48" y="44" width="1824" height="992" rx="16" fill="#142033"/><text x="88" y="108" fill="#F7F9FC" font-size="28">Execution Mode and Role Routing — STATIC_ONLY</text><rect x="88" y="168" width="824" height="576" rx="12" fill="#1B2A42"/><text x="120" y="220" fill="#7DB4FF" font-size="22">Roles: main · developer · reviewer · tester · reflection</text><text x="120" y="270" fill="#B8C4D8" font-size="18">Require capability, privacy and egress match</text><text x="120" y="314" fill="#5EE3A1" font-size="18">Probe + benchmark → next snapshot activation</text><text x="120" y="358" fill="#FF7B86" font-size="18">Unsafe fallback → BLOCKED</text><rect x="952" y="168" width="880" height="576" rx="12" fill="#1B2A42"/><text x="984" y="220" fill="#F8D66D" font-size="22">DataEgressProfile</text><text x="984" y="270" fill="#B8C4D8" font-size="18">local_only · metadata_only · approved_paths · masked_content</text><text x="984" y="314" fill="#FF7B86" font-size="18">Expansion requires human approval; current snapshot unchanged</text><text x="88" y="952" fill="#B8C4D8" font-size="18">RUNTIME_DEFERRED / NOT_EXECUTED · actual route / egress execution: NOT_EXECUTED</text></svg>
