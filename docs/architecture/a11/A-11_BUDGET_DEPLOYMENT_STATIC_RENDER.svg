<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-surface-ids="budget-quota,deployment-monitoring"><rect width="1920" height="1080" fill="#0B1220"/><rect x="48" y="44" width="1824" height="992" rx="16" fill="#142033"/><text x="88" y="108" fill="#F7F9FC" font-size="28">Budget · Quota · Deployment Monitoring — STATIC_ONLY</text><text x="88" y="164" fill="#7DB4FF" font-size="20">FORECAST → RESERVED → PROVIDER_REQUESTED → FINAL_USAGE_RECORDED → RECONCILED</text><text x="88" y="220" fill="#F8D66D" font-size="20">reserve before call; unknown usage is not zero</text><rect x="88" y="284" width="1740" height="310" rx="12" fill="#1B2A42"/><text x="120" y="342" fill="#5EE3A1" font-size="20">MONITORING requires window + critical alert 0 + Owner confirmation</text><text x="120" y="392" fill="#FF7B86" font-size="20">smoke alone cannot RELEASE; data-loss rollback never automatic</text><text x="88" y="952" fill="#B8C4D8" font-size="18">RUNTIME_DEFERRED / NOT_EXECUTED · actual budget/deployment: NOT_EXECUTED</text></svg>
