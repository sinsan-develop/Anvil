<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' role='img' aria-labelledby='title desc'><title id='title'>S12 작업 권한 인계</title><desc id='desc'>여러 사람은 함께 조회하고 한 사람·한 화면만 제어 상세 설계 검토용 정적 시안. 예시 자료이며 실제 기능 실행이 아닙니다.</desc><g font-family='Pretendard, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif'>
<rect x='0' y='0' width='1440' height='900' rx='0' fill='#071321' stroke='#071321'/>
<rect x='0' y='0' width='188' height='900' rx='0' fill='#0a1727' stroke='#304761'/>
<text x='22' y='43' font-size='20' fill='#f4f8ff' font-weight='700'>A N V I L</text>
<text x='22' y='65' font-size='10' fill='#a7c7eb' font-weight='400'>프로젝트는 남고, 도구는 바뀐다</text>
<text x='24' y='130' font-size='14' fill='#dce8f6' font-weight='400'>프로젝트</text>
<text x='24' y='176' font-size='14' fill='#dce8f6' font-weight='400'>방법론</text>
<text x='24' y='222' font-size='14' fill='#dce8f6' font-weight='400'>문서·설계 추적</text>
<text x='24' y='268' font-size='14' fill='#dce8f6' font-weight='400'>헌법·지식</text>
<text x='24' y='314' font-size='14' fill='#dce8f6' font-weight='400'>도구·환경</text>
<text x='24' y='360' font-size='14' fill='#dce8f6' font-weight='400'>승인 요청</text>
<text x='24' y='406' font-size='14' fill='#dce8f6' font-weight='400'>설정</text>
<text x='24' y='452' font-size='14' fill='#dce8f6' font-weight='400'>보조 Dashboard</text>
<text x='22' y='844' font-size='10' fill='#a7c7eb' font-weight='400'>상세 설계 · 정적 시안</text>
<text x='22' y='867' font-size='10' fill='#ffc36c' font-weight='400'>실제 실행·저장 없음</text>
<rect x='188' y='0' width='1252' height='72' rx='0' fill='#0c1b2c' stroke='#304761'/>
<text x='216' y='31' font-size='12' fill='#dce8f6' font-weight='400'>신산님 / 개인 공간</text>
<text x='216' y='52' font-size='10' fill='#a7c7eb' font-weight='400'>여러 사람은 함께 조회하고 한 사람·한 화면만 제어</text>
<text x='1170' y='35' font-size='12' fill='#90d9bb' font-weight='400'>내 작업 권한 · PC</text>
<text x='216' y='111' font-size='16' fill='#f4f8ff' font-weight='600'>S12  작업 권한 인계</text>
<text x='216' y='136' font-size='10' fill='#ffc36c' font-weight='400'>검토용 예시 · 표시 상태는 실제 제품의 구현 결과가 아닙니다</text>
<rect x='216' y='168' width='574' height='156' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='196' font-size='14' fill='#f4f8ff' font-weight='600'>현재 작업 권한</text>
<text x='234' y='223' font-size='12' fill='#dce8f6' font-weight='400'>사용자: 신산님 / 제어 화면: Windows PC</text>
<text x='234' y='248' font-size='12' fill='#dce8f6' font-weight='400'>현재 실행: 구현 단계 작업 1건</text>
<text x='234' y='273' font-size='12' fill='#dce8f6' font-weight='400'>미결 승인: 1건 / 마지막 상태 동기화 보기</text>
<rect x='808' y='168' width='592' height='156' rx='8' fill='#101f32' stroke='#304761'/>
<text x='826' y='196' font-size='14' fill='#f4f8ff' font-weight='600'>인수 요청</text>
<text x='826' y='223' font-size='12' fill='#dce8f6' font-weight='400'>요청자: 허가된 참여자 또는 내 모바일</text>
<text x='826' y='248' font-size='12' fill='#dce8f6' font-weight='400'>사유: 작업 이어받기</text>
<text x='826' y='273' font-size='12' fill='#dce8f6' font-weight='400'>요청 상태: 현재 담당자 안전 대기 준비 전</text>
<rect x='216' y='346' width='1184' height='188' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='374' font-size='14' fill='#f4f8ff' font-weight='600'>인계 확인 항목</text>
<text x='234' y='401' font-size='12' fill='#dce8f6' font-weight='400'>진행 중 실행과 실제 정지 여부 / 완료·미완료 작업</text>
<text x='234' y='426' font-size='12' fill='#dce8f6' font-weight='400'>승인 대기·중요 오류 / 다음 행동·주의사항</text>
<text x='234' y='451' font-size='12' fill='#dce8f6' font-weight='400'>다음 담당자의 인계 요약 확인·수락</text>
<text x='234' y='476' font-size='12' fill='#dce8f6' font-weight='400'>수락·권한 교체 완료 전 새 화면에서 지시·승인 불가</text>
<rect x='216' y='570' width='250' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='228' y='592' font-size='12' fill='#f4f8ff' font-weight='600'>현재 담당자: 안전 대기</text>
<rect x='1080' y='570' width='320' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='1092' y='592' font-size='12' fill='#f4f8ff' font-weight='600'>다음 담당자: 확인·인수 수락</text>
<rect x='216' y='650' width='1184' height='118' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='678' font-size='14' fill='#f4f8ff' font-weight='600'>동시 조회</text>
<text x='234' y='705' font-size='12' fill='#dce8f6' font-weight='400'>조회 참여자는 지식·문서·결과를 볼 수 있으나 지시·수정·승인은 할 수 없습니다.</text>
<text x='234' y='730' font-size='12' fill='#dce8f6' font-weight='400'>다른 화면의 오래된 요청은 서버의 현재 제어권 검사에서 거부됩니다.</text>
</g></svg>