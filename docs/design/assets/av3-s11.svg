<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' role='img' aria-labelledby='title desc'><title id='title'>S11 도구·환경·권한</title><desc id='desc'>실제 지원을 확인한 도구만 배정 · 실행 위치와 시험 대상을 분리 상세 설계 검토용 정적 시안. 예시 자료이며 실제 기능 실행이 아닙니다.</desc><g font-family='Pretendard, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif'>
<rect x='0' y='0' width='1440' height='900' rx='0' fill='#071321' stroke='#071321'/>
<rect x='0' y='0' width='188' height='900' rx='0' fill='#0a1727' stroke='#304761'/>
<text x='22' y='43' font-size='20' fill='#f4f8ff' font-weight='700'>A N V I L</text>
<text x='22' y='65' font-size='10' fill='#a7c7eb' font-weight='400'>프로젝트는 남고, 도구는 바뀐다</text>
<text x='24' y='130' font-size='14' fill='#dce8f6' font-weight='400'>프로젝트</text>
<text x='24' y='176' font-size='14' fill='#dce8f6' font-weight='400'>방법론</text>
<text x='24' y='222' font-size='14' fill='#dce8f6' font-weight='400'>문서·설계 추적</text>
<text x='24' y='268' font-size='14' fill='#dce8f6' font-weight='400'>헌법·지식</text>
<text x='24' y='314' font-size='14' fill='#dce8f6' font-weight='400'>도구·환경</text>
<text x='24' y='360' font-size='14' fill='#dce8f6' font-weight='400'>승인 요청</text>
<text x='24' y='406' font-size='14' fill='#dce8f6' font-weight='400'>설정</text>
<text x='24' y='452' font-size='14' fill='#dce8f6' font-weight='400'>보조 Dashboard</text>
<text x='22' y='844' font-size='10' fill='#a7c7eb' font-weight='400'>상세 설계 · 정적 시안</text>
<text x='22' y='867' font-size='10' fill='#ffc36c' font-weight='400'>실제 실행·저장 없음</text>
<rect x='188' y='0' width='1252' height='72' rx='0' fill='#0c1b2c' stroke='#304761'/>
<text x='216' y='31' font-size='12' fill='#dce8f6' font-weight='400'>신산님 / 개인 공간</text>
<text x='216' y='52' font-size='10' fill='#a7c7eb' font-weight='400'>실제 지원을 확인한 도구만 배정 · 실행 위치와 시험 대상을 분리</text>
<text x='1170' y='35' font-size='12' fill='#90d9bb' font-weight='400'>내 작업 권한 · PC</text>
<text x='216' y='111' font-size='16' fill='#f4f8ff' font-weight='600'>S11  도구·환경·권한</text>
<text x='216' y='136' font-size='10' fill='#ffc36c' font-weight='400'>검토용 예시 · 표시 상태는 실제 제품의 구현 결과가 아닙니다</text>
<rect x='216' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='228' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>코딩 Agent</text>
<rect x='392' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='404' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>환경</text>
<rect x='568' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='580' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>권한</text>
<rect x='1200' y='164' width='200' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='1212' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>+ 연결 등록</text>
<rect x='216' y='222' width='570' height='178' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='250' font-size='14' fill='#f4f8ff' font-weight='600'>연결 대상 · 예시</text>
<text x='234' y='277' font-size='12' fill='#dce8f6' font-weight='400'>기존 코딩 Agent / CLI형 / Windows 실행기</text>
<text x='234' y='302' font-size='12' fill='#dce8f6' font-weight='400'>인증: 보호 저장소 참조 · 원문 표시 안 함</text>
<text x='234' y='327' font-size='12' fill='#dce8f6' font-weight='400'>제품·버전 / 모델·옵션 / 사용 한도</text>
<text x='234' y='352' font-size='12' fill='#dce8f6' font-weight='400'>실제 확인 전 연결·실행 완료로 표시하지 않음</text>
<rect x='804' y='222' width='596' height='178' rx='8' fill='#101f32' stroke='#304761'/>
<text x='822' y='250' font-size='14' fill='#f4f8ff' font-weight='600'>지원 기능 · 제품 버전별 실제 확인 필요</text>
<text x='822' y='277' font-size='12' fill='#dce8f6' font-weight='400'>지시·세션 생성: 미확인 / 상태·결과: 미확인</text>
<text x='822' y='302' font-size='12' fill='#dce8f6' font-weight='400'>중지: 미확인 / 재개: 미확인</text>
<text x='822' y='327' font-size='12' fill='#dce8f6' font-weight='400'>도구 승인: 미확인 / 하위 Agent: 미확인</text>
<text x='822' y='352' font-size='12' fill='#dce8f6' font-weight='400'>미지원 필수 기능이 있으면 해당 역할 배정 불가</text>
<rect x='216' y='420' width='570' height='180' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='448' font-size='14' fill='#f4f8ff' font-weight='600'>환경 연결</text>
<text x='234' y='475' font-size='12' fill='#dce8f6' font-weight='400'>Agent 실행: Windows</text>
<text x='234' y='500' font-size='12' fill='#dce8f6' font-weight='400'>빌드·시험 대상: 사용자 지정 WSL 환경</text>
<text x='234' y='525' font-size='12' fill='#dce8f6' font-weight='400'>소스 위치·명령·도구·접속 참조</text>
<text x='234' y='550' font-size='12' fill='#dce8f6' font-weight='400'>운영 자원과 개발 자원은 별도 정의</text>
<rect x='804' y='420' width='596' height='180' rx='8' fill='#101f32' stroke='#304761'/>
<text x='822' y='448' font-size='14' fill='#f4f8ff' font-weight='600'>작업 권한 · 예시 설정안</text>
<text x='822' y='475' font-size='12' fill='#dce8f6' font-weight='400'>지정 소스 수정·핵심 시험: 자동 허용</text>
<text x='822' y='500' font-size='12' fill='#dce8f6' font-weight='400'>DB 변경·외부 push·배포: 실행 전 승인</text>
<text x='822' y='525' font-size='12' fill='#dce8f6' font-weight='400'>다른 프로젝트·운영 Secret 접근: 금지</text>
<text x='822' y='550' font-size='12' fill='#dce8f6' font-weight='400'>책임자·하위 Agent 모두 같은 경계 적용</text>
<rect x='216' y='644' width='200' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='228' y='666' font-size='12' fill='#f4f8ff' font-weight='600'>읽기 연결 확인</text>
<rect x='432' y='644' width='240' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='444' y='666' font-size='12' fill='#f4f8ff' font-weight='600'>범위 확인 후 실제 시험</text>
<rect x='1180' y='644' width='220' height='34' rx='6' fill='#2369b6' stroke='#54799e'/>
<text x='1192' y='666' font-size='12' fill='#f4f8ff' font-weight='600'>설정 개정 저장</text>
</g></svg>