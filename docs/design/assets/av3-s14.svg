<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' role='img' aria-labelledby='title desc'><title id='title'>S14 설정·백업·보조 조회</title><desc id='desc'>원본 보존·복구와 사용자 선택 · Dashboard는 보조 화면 상세 설계 검토용 정적 시안. 예시 자료이며 실제 기능 실행이 아닙니다.</desc><g font-family='Pretendard, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif'>
<rect x='0' y='0' width='1440' height='900' rx='0' fill='#071321' stroke='#071321'/>
<rect x='0' y='0' width='188' height='900' rx='0' fill='#0a1727' stroke='#304761'/>
<text x='22' y='43' font-size='20' fill='#f4f8ff' font-weight='700'>A N V I L</text>
<text x='22' y='65' font-size='10' fill='#a7c7eb' font-weight='400'>프로젝트는 남고, 도구는 바뀐다</text>
<text x='24' y='130' font-size='14' fill='#dce8f6' font-weight='400'>프로젝트</text>
<text x='24' y='176' font-size='14' fill='#dce8f6' font-weight='400'>방법론</text>
<text x='24' y='222' font-size='14' fill='#dce8f6' font-weight='400'>문서·설계 추적</text>
<text x='24' y='268' font-size='14' fill='#dce8f6' font-weight='400'>헌법·지식</text>
<text x='24' y='314' font-size='14' fill='#dce8f6' font-weight='400'>도구·환경</text>
<text x='24' y='360' font-size='14' fill='#dce8f6' font-weight='400'>승인 요청</text>
<text x='24' y='406' font-size='14' fill='#dce8f6' font-weight='400'>설정</text>
<text x='24' y='452' font-size='14' fill='#dce8f6' font-weight='400'>보조 Dashboard</text>
<text x='22' y='844' font-size='10' fill='#a7c7eb' font-weight='400'>상세 설계 · 정적 시안</text>
<text x='22' y='867' font-size='10' fill='#ffc36c' font-weight='400'>실제 실행·저장 없음</text>
<rect x='188' y='0' width='1252' height='72' rx='0' fill='#0c1b2c' stroke='#304761'/>
<text x='216' y='31' font-size='12' fill='#dce8f6' font-weight='400'>신산님 / 개인 공간</text>
<text x='216' y='52' font-size='10' fill='#a7c7eb' font-weight='400'>원본 보존·복구와 사용자 선택 · Dashboard는 보조 화면</text>
<text x='1170' y='35' font-size='12' fill='#90d9bb' font-weight='400'>내 작업 권한 · PC</text>
<text x='216' y='111' font-size='16' fill='#f4f8ff' font-weight='600'>S14  설정·백업·보조 조회</text>
<text x='216' y='136' font-size='10' fill='#ffc36c' font-weight='400'>검토용 예시 · 표시 상태는 실제 제품의 구현 결과가 아닙니다</text>
<rect x='216' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='228' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>백업·복구</text>
<rect x='392' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='404' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>참여자</text>
<rect x='568' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='580' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>실행 한도</text>
<rect x='744' y='164' width='160' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='756' y='186' font-size='12' fill='#f4f8ff' font-weight='600'>중요 알림</text>
<text x='216' y='252' font-size='12' fill='#9cb8d7' font-weight='400'>백업 위치</text>
<rect x='216' y='264' width='570' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='228' y='288' font-size='12' fill='#dce8f6' font-weight='400'>사용자가 지정한 보호 저장 위치</text>
<text x='216' y='348' font-size='12' fill='#9cb8d7' font-weight='400'>주기 / 보관 기간 / 암호화 참조</text>
<rect x='216' y='360' width='570' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='228' y='384' font-size='12' fill='#dce8f6' font-weight='400'>사용자 선택값 · 미설정 시 준비 필요 표시</text>
<rect x='804' y='224' width='596' height='220' rx='8' fill='#101f32' stroke='#304761'/>
<text x='822' y='252' font-size='14' fill='#f4f8ff' font-weight='600'>백업 상태 · 예시</text>
<text x='822' y='279' font-size='12' fill='#dce8f6' font-weight='400'>마지막 성공: 설정 후 실제 결과로 표시</text>
<text x='822' y='304' font-size='12' fill='#dce8f6' font-weight='400'>포함: 문서·대화·지식·실행·증거</text>
<text x='822' y='329' font-size='12' fill='#dce8f6' font-weight='400'>소스·미커밋 자료 포함 여부 명시</text>
<text x='822' y='354' font-size='12' fill='#dce8f6' font-weight='400'>Secret 원문·외부 계정은 별도 보호</text>
<text x='822' y='379' font-size='12' fill='#dce8f6' font-weight='400'>복구 검사 전 성공을 추정하지 않음</text>
<rect x='216' y='468' width='1184' height='156' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='496' font-size='14' fill='#f4f8ff' font-weight='600'>복구 / 내보내기</text>
<text x='234' y='523' font-size='12' fill='#dce8f6' font-weight='400'>검증용 복원 → 무결성 확인 → 현재 자료 영향 비교 → 사용자 확인 → 적용</text>
<text x='234' y='548' font-size='12' fill='#dce8f6' font-weight='400'>복구 뒤 실제 실행 상태를 대조하고 사용자 재개 전 새 쓰기 작업 시작 안 함</text>
<text x='234' y='573' font-size='12' fill='#dce8f6' font-weight='400'>도구 로그인 없이 프로젝트 원본을 조회할 수 있는 이식 묶음 제공</text>
<rect x='216' y='650' width='220' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='228' y='672' font-size='12' fill='#f4f8ff' font-weight='600'>백업 내용 확인</text>
<rect x='454' y='650' width='240' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='466' y='672' font-size='12' fill='#f4f8ff' font-weight='600'>복구 영향 비교</text>
<rect x='1140' y='650' width='260' height='34' rx='6' fill='#2369b6' stroke='#54799e'/>
<text x='1152' y='672' font-size='12' fill='#f4f8ff' font-weight='600'>설정 저장</text>
<rect x='216' y='714' width='1184' height='112' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='742' font-size='14' fill='#f4f8ff' font-weight='600'>보조 Dashboard</text>
<text x='234' y='769' font-size='12' fill='#dce8f6' font-weight='400'>현재 단계·필요 결정·확인된 문제·다음 행동 → 각각의 실제 작업 화면으로 이동</text>
<text x='234' y='794' font-size='12' fill='#dce8f6' font-weight='400'>프로젝트 첫 화면이나 제품 중심을 모니터링 지표로 바꾸지 않음</text>
</g></svg>