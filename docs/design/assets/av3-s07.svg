<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' role='img' aria-labelledby='title desc'><title id='title'>S07 설계 변경과 영향</title><desc id='desc'>변경 이유 → 영향 → 사용자 승인 → 계획 개정 → 영향 작업 재개 상세 설계 검토용 정적 시안. 예시 자료이며 실제 기능 실행이 아닙니다.</desc><g font-family='Pretendard, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif'>
<rect x='0' y='0' width='1440' height='900' rx='0' fill='#071321' stroke='#071321'/>
<rect x='0' y='0' width='188' height='900' rx='0' fill='#0a1727' stroke='#304761'/>
<text x='22' y='43' font-size='20' fill='#f4f8ff' font-weight='700'>A N V I L</text>
<text x='22' y='65' font-size='10' fill='#a7c7eb' font-weight='400'>프로젝트는 남고, 도구는 바뀐다</text>
<text x='24' y='130' font-size='14' fill='#dce8f6' font-weight='400'>프로젝트</text>
<text x='24' y='176' font-size='14' fill='#dce8f6' font-weight='400'>방법론</text>
<text x='24' y='222' font-size='14' fill='#dce8f6' font-weight='400'>문서·설계 추적</text>
<text x='24' y='268' font-size='14' fill='#dce8f6' font-weight='400'>헌법·지식</text>
<text x='24' y='314' font-size='14' fill='#dce8f6' font-weight='400'>도구·환경</text>
<text x='24' y='360' font-size='14' fill='#dce8f6' font-weight='400'>승인 요청</text>
<text x='24' y='406' font-size='14' fill='#dce8f6' font-weight='400'>설정</text>
<text x='24' y='452' font-size='14' fill='#dce8f6' font-weight='400'>보조 Dashboard</text>
<text x='22' y='844' font-size='10' fill='#a7c7eb' font-weight='400'>상세 설계 · 정적 시안</text>
<text x='22' y='867' font-size='10' fill='#ffc36c' font-weight='400'>실제 실행·저장 없음</text>
<rect x='188' y='0' width='1252' height='72' rx='0' fill='#0c1b2c' stroke='#304761'/>
<text x='216' y='31' font-size='12' fill='#dce8f6' font-weight='400'>신산님 / 개인 공간</text>
<text x='216' y='52' font-size='10' fill='#a7c7eb' font-weight='400'>변경 이유 → 영향 → 사용자 승인 → 계획 개정 → 영향 작업 재개</text>
<text x='1170' y='35' font-size='12' fill='#90d9bb' font-weight='400'>내 작업 권한 · PC</text>
<text x='216' y='111' font-size='16' fill='#f4f8ff' font-weight='600'>S07  설계 변경과 영향</text>
<text x='216' y='136' font-size='10' fill='#ffc36c' font-weight='400'>검토용 예시 · 표시 상태는 실제 제품의 구현 결과가 아닙니다</text>
<text x='216' y='177' font-size='12' fill='#9cb8d7' font-weight='400'>변경 요청 / 이유</text>
<rect x='216' y='189' width='1184' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='228' y='213' font-size='12' fill='#dce8f6' font-weight='400'>D-승인-01 · 요청자가 처리 결과를 다시 확인할 수 있도록 흐름 보완</text>
<rect x='216' y='254' width='574' height='156' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='282' font-size='14' fill='#f4f8ff' font-weight='600'>변경 전 · 설계 v2</text>
<text x='234' y='309' font-size='12' fill='#dce8f6' font-weight='400'>승인 결정 후 목록으로 이동</text>
<text x='234' y='334' font-size='12' fill='#dce8f6' font-weight='400'>연결된 계획 3개 / 시험 2개</text>
<text x='234' y='359' font-size='12' fill='#dce8f6' font-weight='400'>현재 기준으로 수행한 결과는 보존</text>
<rect x='808' y='254' width='592' height='156' rx='8' fill='#101f32' stroke='#304761'/>
<text x='826' y='282' font-size='14' fill='#f4f8ff' font-weight='600'>변경 후 · 검토 제안 v3</text>
<text x='826' y='309' font-size='12' fill='#dce8f6' font-weight='400'>결정 결과와 저장 시각 확인 후 목록 이동</text>
<text x='826' y='334' font-size='12' fill='#dce8f6' font-weight='400'>아직 실행 기준에 적용되지 않음</text>
<text x='826' y='359' font-size='12' fill='#dce8f6' font-weight='400'>이유·요청자·원문 참조를 함께 기록</text>
<rect x='216' y='430' width='1184' height='184' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='458' font-size='14' fill='#f4f8ff' font-weight='600'>영향 분석</text>
<text x='234' y='485' font-size='12' fill='#dce8f6' font-weight='400'>화면·동작: 영향 있음 / 저장 계약: 영향 미확인 → 확인 필요</text>
<text x='234' y='510' font-size='12' fill='#dce8f6' font-weight='400'>계획: 화면·연결 작업 개정 / 기존 완료: 새 기준 재확인 필요</text>
<text x='234' y='535' font-size='12' fill='#dce8f6' font-weight='400'>검증: 결과 표시·재조회 / 권한: 변경 없음 (근거 보기)</text>
<text x='234' y='560' font-size='12' fill='#dce8f6' font-weight='400'>무관한 작업은 계속 · 영향 작업은 적용 승인·계획 개정 후 재개</text>
<rect x='760' y='652' width='180' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='772' y='674' font-size='12' fill='#f4f8ff' font-weight='600'>수정 지시</text>
<rect x='956' y='652' width='150' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='968' y='674' font-size='12' fill='#f4f8ff' font-weight='600'>거절</text>
<rect x='1122' y='652' width='278' height='34' rx='6' fill='#2369b6' stroke='#54799e'/>
<text x='1134' y='674' font-size='12' fill='#f4f8ff' font-weight='600'>변경 적용 승인</text>
<rect x='216' y='730' width='1184' height='92' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='758' font-size='14' fill='#f4f8ff' font-weight='600'>이력</text>
<text x='234' y='785' font-size='12' fill='#dce8f6' font-weight='400'>최초 설계 → 변경 이유 → 사용자 결정 → 계획 버전 → 코드 → 시험 → 결과 판정</text>
</g></svg>