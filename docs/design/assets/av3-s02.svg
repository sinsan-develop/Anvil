<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' role='img' aria-labelledby='title desc'><title id='title'>S02 프로젝트 만들기</title><desc id='desc'>목적·소스 → 방법론 → 도구·환경 → 시작 기준 확인 상세 설계 검토용 정적 시안. 예시 자료이며 실제 기능 실행이 아닙니다.</desc><g font-family='Pretendard, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif'>
<rect x='0' y='0' width='1440' height='900' rx='0' fill='#071321' stroke='#071321'/>
<rect x='0' y='0' width='188' height='900' rx='0' fill='#0a1727' stroke='#304761'/>
<text x='22' y='43' font-size='20' fill='#f4f8ff' font-weight='700'>A N V I L</text>
<text x='22' y='65' font-size='10' fill='#a7c7eb' font-weight='400'>프로젝트는 남고, 도구는 바뀐다</text>
<text x='24' y='130' font-size='14' fill='#dce8f6' font-weight='400'>프로젝트</text>
<text x='24' y='176' font-size='14' fill='#dce8f6' font-weight='400'>방법론</text>
<text x='24' y='222' font-size='14' fill='#dce8f6' font-weight='400'>문서·설계 추적</text>
<text x='24' y='268' font-size='14' fill='#dce8f6' font-weight='400'>헌법·지식</text>
<text x='24' y='314' font-size='14' fill='#dce8f6' font-weight='400'>도구·환경</text>
<text x='24' y='360' font-size='14' fill='#dce8f6' font-weight='400'>승인 요청</text>
<text x='24' y='406' font-size='14' fill='#dce8f6' font-weight='400'>설정</text>
<text x='24' y='452' font-size='14' fill='#dce8f6' font-weight='400'>보조 Dashboard</text>
<text x='22' y='844' font-size='10' fill='#a7c7eb' font-weight='400'>상세 설계 · 정적 시안</text>
<text x='22' y='867' font-size='10' fill='#ffc36c' font-weight='400'>실제 실행·저장 없음</text>
<rect x='188' y='0' width='1252' height='72' rx='0' fill='#0c1b2c' stroke='#304761'/>
<text x='216' y='31' font-size='12' fill='#dce8f6' font-weight='400'>신산님 / 개인 공간</text>
<text x='216' y='52' font-size='10' fill='#a7c7eb' font-weight='400'>목적·소스 → 방법론 → 도구·환경 → 시작 기준 확인</text>
<text x='1170' y='35' font-size='12' fill='#90d9bb' font-weight='400'>내 작업 권한 · PC</text>
<text x='216' y='111' font-size='16' fill='#f4f8ff' font-weight='600'>S02  프로젝트 만들기</text>
<text x='216' y='136' font-size='10' fill='#ffc36c' font-weight='400'>검토용 예시 · 표시 상태는 실제 제품의 구현 결과가 아닙니다</text>
<rect x='216' y='168' width='1184' height='94' rx='8' fill='#101f32' stroke='#304761'/>
<text x='234' y='196' font-size='14' fill='#f4f8ff' font-weight='600'>1 목적·소스     →     2 방법론·자료     →     3 총괄·환경     →     4 시작 기준</text>
<text x='234' y='223' font-size='12' fill='#dce8f6' font-weight='400'>프로젝트 생성과 Agent 작업 시작은 별개입니다.</text>
<text x='240' y='306' font-size='12' fill='#9cb8d7' font-weight='400'>프로젝트 이름 *</text>
<rect x='240' y='318' width='530' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='252' y='342' font-size='12' fill='#dce8f6' font-weight='400'>개인 업무 도구</text>
<text x='240' y='398' font-size='12' fill='#9cb8d7' font-weight='400'>왜 만드는가 / 원하는 결과 *</text>
<rect x='240' y='410' width='530' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='252' y='434' font-size='12' fill='#dce8f6' font-weight='400'>내 절차대로 반복 업무를 개발하고 이어가기</text>
<text x='240' y='490' font-size='12' fill='#9cb8d7' font-weight='400'>소스 시작 방식</text>
<rect x='240' y='502' width='530' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='252' y='526' font-size='12' fill='#dce8f6' font-weight='400'>● 기존 소스 조사    ○ 새 빈 프로젝트</text>
<text x='240' y='582' font-size='12' fill='#9cb8d7' font-weight='400'>실행기 / 허용 소스 경로</text>
<rect x='240' y='594' width='530' height='38' rx='5' fill='#0b1929' stroke='#527596'/>
<text x='252' y='618' font-size='12' fill='#dce8f6' font-weight='400'>내 Windows 실행기 / 사용자가 지정한 폴더</text>
<rect x='810' y='306' width='566' height='232' rx='8' fill='#101f32' stroke='#304761'/>
<text x='828' y='334' font-size='14' fill='#f4f8ff' font-weight='600'>기존 소스 조사 결과 · 예시</text>
<text x='828' y='361' font-size='12' fill='#dce8f6' font-weight='400'>구현·핵심 동작 확인   2개   [근거 보기]</text>
<text x='828' y='386' font-size='12' fill='#dce8f6' font-weight='400'>구현했지만 미확인    3개</text>
<text x='828' y='411' font-size='12' fill='#dce8f6' font-weight='400'>부분 구현             1개</text>
<text x='828' y='436' font-size='12' fill='#dce8f6' font-weight='400'>미구현                4개</text>
<text x='828' y='461' font-size='12' fill='#dce8f6' font-weight='400'>읽기 조사만 수행 · 기준선은 사용자 확인 전</text>
<rect x='810' y='558' width='566' height='120' rx='8' fill='#101f32' stroke='#304761'/>
<text x='828' y='586' font-size='14' fill='#f4f8ff' font-weight='600'>선택한 기준</text>
<text x='828' y='613' font-size='12' fill='#dce8f6' font-weight='400'>일반 개발 절차 v1 · 프로젝트 전용 복사</text>
<text x='828' y='638' font-size='12' fill='#dce8f6' font-weight='400'>총괄: 연결 도구 선택 전 / 환경: 준비 필요</text>
<rect x='240' y='742' width='150' height='34' rx='6' fill='#152b43' stroke='#54799e'/>
<text x='252' y='764' font-size='12' fill='#f4f8ff' font-weight='600'>중간 저장</text>
<rect x='1106' y='742' width='270' height='34' rx='6' fill='#2369b6' stroke='#54799e'/>
<text x='1118' y='764' font-size='12' fill='#f4f8ff' font-weight='600'>기준 확인·프로젝트 생성</text>
</g></svg>