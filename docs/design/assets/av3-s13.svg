<svg xmlns='http://www.w3.org/2000/svg' width='430' height='844' viewBox='0 0 430 844' role='img' aria-labelledby='title desc'><title id='title'>S13 모바일 프로젝트 작업</title><desc id='desc'>설계 검토용 예시. 대화 기본, 절차·문서·승인 탭. 실제 실행 없음.</desc><g font-family='Pretendard, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif'>
<rect x='0' y='0' width='430' height='844' rx='0' fill='#071321' stroke='#304761'/>
<text x='18' y='31' font-size='16' fill='#f4f8ff' font-weight='700'>ANVIL  /  개인 업무 도구</text>
<text x='18' y='58' font-size='10' fill='#ffc36c' font-weight='400'>S13 · 정적 시안 · 실제 실행·저장 없음</text>
<rect x='12' y='78' width='406' height='75' rx='8' fill='#101f32' stroke='#304761'/>
<text x='26' y='103' font-size='14' fill='#dce8f6' font-weight='400'>총괄 ▾   /   현재: 구현 단계</text>
<text x='26' y='132' font-size='12' fill='#ffc36c' font-weight='400'>조회 중 · 지시·승인은 제어권 인수 후 가능</text>
<rect x='12' y='170' width='406' height='140' rx='8' fill='#101f32' stroke='#304761'/>
<text x='30' y='198' font-size='14' fill='#f4f8ff' font-weight='600'>총괄 · 예시</text>
<text x='30' y='225' font-size='12' fill='#dce8f6' font-weight='400'>승인 저장 기능을 연결하고 있습니다.</text>
<text x='30' y='250' font-size='12' fill='#dce8f6' font-weight='400'>이미 확인한 동작은 다시 실행하지 않습니다.</text>
<text x='30' y='275' font-size='12' fill='#dce8f6' font-weight='400'>실제 저장·재조회 확인은 남아 있습니다.</text>
<rect x='12' y='326' width='406' height='112' rx='8' fill='#101f32' stroke='#304761'/>
<text x='30' y='354' font-size='14' fill='#f4f8ff' font-weight='600'>사용자 결정 필요 · 1건</text>
<text x='30' y='381' font-size='12' fill='#dce8f6' font-weight='400'>대상·이유·영향·복구를 확인하세요.</text>
<text x='30' y='406' font-size='12' fill='#dce8f6' font-weight='400'>PC와 같은 요청 · 한 번만 결정됩니다.</text>
<rect x='26' y='452' width='378' height='48' rx='6' fill='#2369b6' stroke='#54799e'/>
<text x='44' y='482' font-size='16' fill='#ffffff' font-weight='600'>승인 요청 상세 보기 →</text>
<rect x='12' y='518' width='406' height='130' rx='8' fill='#101f32' stroke='#304761'/>
<text x='30' y='546' font-size='14' fill='#f4f8ff' font-weight='600'>현재 실제 관측</text>
<text x='30' y='573' font-size='12' fill='#dce8f6' font-weight='400'>관련 시험 수신 / 화면 연결 확인 중</text>
<text x='30' y='598' font-size='12' fill='#dce8f6' font-weight='400'>마지막 서버 동기화 12초 전</text>
<text x='30' y='623' font-size='12' fill='#dce8f6' font-weight='400'>도구 보고와 실제 결과 펼치기 →</text>
<rect x='12' y='666' width='406' height='72' rx='6' fill='#0b1929' stroke='#527596'/>
<text x='26' y='692' font-size='12' fill='#dce8f6' font-weight='400'>추가 지시 / 중단 후 지시 ▾</text>
<text x='26' y='722' font-size='16' fill='#a7c7eb' font-weight='400'>인수 후 지시를 입력하세요</text>
<rect x='0' y='766' width='430' height='78' rx='0' fill='#101f32' stroke='#304761'/>
<text x='20' y='811' font-size='12' fill='#dce8f6' font-weight='400'>대화</text>
<text x='120' y='811' font-size='12' fill='#dce8f6' font-weight='400'>절차</text>
<text x='210' y='811' font-size='12' fill='#dce8f6' font-weight='400'>문서·결과</text>
<text x='337' y='811' font-size='12' fill='#dce8f6' font-weight='400'>승인 1</text>
</g></svg>