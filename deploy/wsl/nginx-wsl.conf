# WSL QA ingress only. All UI and API content comes from the application.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
    map $http_host $allowed_qa_host {
        default 0;
        "127.0.0.1:4770" 1;
        "127.0.0.1:4870" 1;
    }
    upstream anvil_application {
        server anvil-web:3770;
        keepalive 8;
    }
    server {
        listen 8080;
        server_name 127.0.0.1;
        if ($allowed_qa_host = 0) { return 403; }
        if ($request_method = CONNECT) { return 405; }
        location / {
            proxy_pass http://anvil_application;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_redirect off;
        }
    }
}
