# WSL 개발 전용 독립 profile. 기존 F18 QA Compose와 병합하지 않는다(PG 생성 금지).
name: anvil-u01-development
services:
  web:
    container_name: anvil-web
    image: ${ANVIL_U01_WEB_IMAGE_ID:?verified sha256 image ID required}
    user: "101:101"
    ports: ["${ANVIL_U01_PRIVATE_IP:?current private IPv4 required}:3770:3770"]
    depends_on: [api, oidc-issuer]
    networks:
      internal:
        ipv4_address: ${ANVIL_U01_WEB_INTERNAL_IP:?exact trusted Web IP required}
      proxy: {}
    volumes:
      - {type: bind, source: ./nginx-u01-development.conf, target: /etc/nginx/nginx.conf, read_only: true}
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/tls.crt", target: /run/anvil-f18-oidc/tls.crt, read_only: true}
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/tls.key", target: /run/anvil-f18-oidc/tls.key, read_only: true}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  api:
    image: ${ANVIL_U01_API_IMAGE_ID:?verified sha256 image ID required}
    user: "10001:10001"
    entrypoint: [/opt/venv/bin/uvicorn, "apps.api.anvil_api.asgi:app", --host, 0.0.0.0, --port, "3770", --no-access-log]
    env_file: ["${ANVIL_U01_MATERIAL_DIR:?private directory required}/api.env"]
    environment:
      ANVIL_AUTH_MODE: OIDC
      ANVIL_F15_OPERATIONAL_SHELL: "1"
      ANVIL_RUNTIME_ENVIRONMENT: WSL_SERVER_TEST_STAGING
      ANVIL_CONSOLE_BASE_URL: "https://${ANVIL_U01_PRIVATE_IP:?current private IPv4 required}:3770"
      ANVIL_PUBLIC_HOST: ${ANVIL_U01_PRIVATE_IP:?current private IPv4 required}
      FORWARDED_ALLOW_IPS: ${ANVIL_U01_WEB_INTERNAL_IP:?exact trusted Web IP required}
      ANVIL_OIDC_ISSUER: "https://${ANVIL_U01_PRIVATE_IP:?current private IPv4 required}:3770/realms/anvil"
      ANVIL_OIDC_CLIENT_ID: anvil-web
      ANVIL_OIDC_STEP_UP_ACR: urn:anvil:step-up
      ANVIL_F18_OIDC_TRUST_FILE: /run/anvil-f18-oidc/trust.json
    networks:
      internal:
        aliases: [anvil-u01-api]
      proxy: {}
    volumes:
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/trust.json", target: /run/anvil-f18-oidc/trust.json, read_only: true}
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/ca.crt", target: /run/anvil-f18-oidc/ca.crt, read_only: true}
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/client-secret", target: /run/anvil-f18-oidc/client-secret, read_only: true}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  oidc-issuer:
    image: ${ANVIL_U01_ISSUER_IMAGE_ID:?verified sha256 image ID required}
    user: "10001:10001"
    environment:
      ANVIL_U01_WSL_TEST_LOGIN: "1"
      ANVIL_RUNTIME_ENVIRONMENT: WSL_SERVER_TEST_STAGING
      ANVIL_F19A_QA_SUBJECT: f19a-qa-reader
      ANVIL_OIDC_ISSUER: "https://${ANVIL_U01_PRIVATE_IP:?current private IPv4 required}:3770/realms/anvil"
      ANVIL_U01_REDIRECT_URI: "https://${ANVIL_U01_PRIVATE_IP:?current private IPv4 required}:3770/"
    networks:
      internal:
        aliases: [anvil-u01-issuer]
    volumes:
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/signing.key", target: /run/anvil-f18-oidc/signing.key, read_only: true}
      - {type: bind, source: "${ANVIL_U01_MATERIAL_DIR:?private directory required}/client-secret", target: /run/anvil-f18-oidc/client-secret, read_only: true}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
networks:
  internal:
    name: anvil-u01-development-runtime
    internal: true
    ipam:
      config:
        - subnet: ${ANVIL_U01_INTERNAL_SUBNET:?nonconflicting Anvil-owned subnet required}
  proxy:
    external: true
    name: proxy-network
