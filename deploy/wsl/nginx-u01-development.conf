# WSL 개발 TLS ingress. 인증 query/cookie는 정상·오류 어느 로그에도 기록하지 않는다.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/null crit;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 3770 ssl;
        server_name _;
        ssl_certificate /run/anvil-f18-oidc/tls.crt;
        ssl_certificate_key /run/anvil-f18-oidc/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        location = /fixture-workbench { return 404; }
        location = /fixture-workbench.html { return 404; }
        location /api/ {
            proxy_pass http://anvil-u01-api:3770;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /auth/ {
            proxy_pass http://anvil-u01-api:3770;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /realms/anvil/ {
            proxy_pass http://anvil-u01-issuer:8302;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
