# R43A WSL-only OIDC QA overlay. Apply after compose.f18.yml; never alone.
# The synthetic files and issuer image are supplied by the isolated R43B run.
services:
  web:
    ports: !override ["127.0.0.1:8444:8444"]
    depends_on: !override [api, oidc-issuer]
    networks:
      internal:
        aliases: [anvil-f18-qa.local]
      ingress: {}
    volumes:
      - type: bind
        source: ./nginx-f18-oidc.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/tls.crt
        target: /run/anvil-f18-oidc/tls.crt
        read_only: true
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/tls.key
        target: /run/anvil-f18-oidc/tls.key
        read_only: true
    read_only: true
    labels:
      com.anvil.cleanup-scope: F18_ISOLATED_WSL_OPS

  api:
    environment:
      ANVIL_AUTH_MODE: OIDC
      ANVIL_CONSOLE_BASE_URL: https://anvil-f18-qa.local:8444
      ANVIL_PUBLIC_HOST: anvil-f18-qa.local
      ANVIL_OIDC_ISSUER: https://anvil-f18-qa.local:8444/realms/anvil
      ANVIL_OIDC_CLIENT_ID: anvil-web
      ANVIL_OIDC_STEP_UP_ACR: urn:anvil:step-up
      ANVIL_F18_OIDC_TRUST_FILE: /run/anvil-f18-oidc/trust.json
    volumes:
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/trust.json
        target: /run/anvil-f18-oidc/trust.json
        read_only: true
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/ca.crt
        target: /run/anvil-f18-oidc/ca.crt
        read_only: true
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/client-secret
        target: /run/anvil-f18-oidc/client-secret
        read_only: true

  oidc-issuer:
    image: "${ANVIL_F18_OIDC_ISSUER_IMAGE_REF:?verified QA issuer image ID required}"
    networks: [internal]
    volumes:
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/signing.key
        target: /run/anvil-f18-oidc/signing.key
        read_only: true
      - type: bind
        source: ${ANVIL_F18_OIDC_MATERIAL_DIR:?dedicated synthetic material directory required}/client-secret
        target: /run/anvil-f18-oidc/client-secret
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    labels:
      com.anvil.cleanup-scope: F18_ISOLATED_WSL_OPS
