<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvil 개발 클라이언트</title><link rel="stylesheet" href="settings.css"></head><body><header><strong>Anvil 개발 클라이언트 · 설치형 Shell</strong><button id="info" aria-label="지원 범위">ⓘ</button><button id="quit">클라이언트 종료</button></header><form id="connect-form"><label>서버 기본주소 <input id="origin" type="text" maxlength="2048" placeholder="https://" autocomplete="off" spellcheck="false"></label><label id="replace-label" hidden><input id="replace" type="checkbox">손상 설정 원문 보존 후 명시 교체</label><button id="connect" type="submit">명시 연결/재연결</button></form><p id="status" role="status">미연결</p><p id="error" role="alert" hidden></p><dialog id="information"><p>같은 서버의 기존 WebUI와 로그인을 사용합니다. 화면 표시만으로 인증·현재성·실행기 상태를 확인하지 않습니다. 팝업·다운로드·브라우저 권한 기능은 미지원입니다. 창 닫기는 숨김이며 트레이에서 다시 표시할 수 있습니다.</p><p>실행기·spool·checkpoint 회수는 미구현이며 안전종료는 미검증입니다.</p><button id="close-info">닫기</button></dialog><script src="settings.js"></script></body></html>
